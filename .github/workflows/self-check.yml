name: Self-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Runs the real bundled action against generated fixtures, so the shipped
  # dist/ is exercised in a real runner rather than only through vitest.
  self-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Build fixtures
        run: |
          node scripts/make-fixture-archive.mjs "$RUNNER_TEMP/base" base
          node scripts/make-fixture-archive.mjs "$RUNNER_TEMP/head" head

      # Record the base fixture as a baseline, keyed by a fixed sha so the
      # walk-back finds it deterministically.
      - name: Record baseline
        run: |
          mkdir -p "$RUNNER_TEMP/baselines"
          node dist/index.js
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/baseline-summary.md
          INPUT_ARCHIVE: ${{ runner.temp }}/base/MyApp.xcarchive
          INPUT_THINNING-REPORT: ${{ runner.temp }}/base/App Thinning Size Report.txt
          INPUT_LOCKFILES: ${{ runner.temp }}/base/Package.resolved
          INPUT_MANIFEST-OUT: ${{ runner.temp }}/baselines/${{ github.sha }}.json
          INPUT_COMMENT: 'false'
          INPUT_ANNOTATIONS: 'false'

      - name: Clean run — the base against its own baseline must pass
        run: |
          summary="$RUNNER_TEMP/clean-summary.md"
          : > "$summary"
          GITHUB_STEP_SUMMARY="$summary" node dist/index.js
          cat "$summary"
          # Guard against a false pass: without a baseline this reports a first
          # run and trivially succeeds, which would make the check meaningless.
          grep -q 'baseline' "$summary" \
            || { echo "::error::no baseline was found, so this proved nothing"; exit 1; }
          grep -q 'No change in download size' "$summary" \
            || { echo "::error::comparing a build against itself should report no change"; exit 1; }
        env:
          INPUT_ARCHIVE: ${{ runner.temp }}/base/MyApp.xcarchive
          INPUT_THINNING-REPORT: ${{ runner.temp }}/base/App Thinning Size Report.txt
          INPUT_LOCKFILES: ${{ runner.temp }}/base/Package.resolved
          INPUT_BASE-REF: ${{ github.sha }}
          INPUT_BASELINE-DIRECTORY: ${{ runner.temp }}/baselines
          INPUT_COMMENT: 'false'

      - name: Regressing run — must fail, and name the causes
        run: |
          # Assert against the job summary, not stdout. The report reaches the
          # summary and the `report` output; stdout carries only log lines. An
          # earlier version of this check grepped stdout and passed locally only
          # because, with GITHUB_OUTPUT unset, @actions/core falls back to the
          # deprecated ::set-output command and the report leaked there.
          summary="$RUNNER_TEMP/regress-summary.md"
          : > "$summary"
          set +e
          GITHUB_STEP_SUMMARY="$summary" node dist/index.js > out.txt 2>&1
          rc=$?
          set -e
          echo "--- stdout ---"; cat out.txt
          echo "--- job summary ---"; cat "$summary"

          fail() { echo "::error::$1"; exit 1; }

          [ "$rc" -eq 1 ] || fail "expected exit 1 for a build over budget, got $rc"
          [ -s "$summary" ] || fail "no job summary was written"

          grep -q 'dependency `4.3.0 → 4.4.1`' "$summary" \
            || fail "the report did not name the dependency bump as the cause"
          grep -q 'Onboarding.json' "$summary" \
            || fail "the report did not name the new resource"
          grep -q 'Budget' "$summary" \
            || fail "the report did not frame the gate as a budget"
          # A dSYM leaking in would dwarf every real contributor.
          ! grep -q 'dSYM' "$summary" || fail "dSYMs must never appear in the report"
        env:
          INPUT_ARCHIVE: ${{ runner.temp }}/head/MyApp.xcarchive
          INPUT_THINNING-REPORT: ${{ runner.temp }}/head/App Thinning Size Report.txt
          INPUT_LOCKFILES: ${{ runner.temp }}/head/Package.resolved
          INPUT_BASE-REF: ${{ github.sha }}
          INPUT_BASELINE-DIRECTORY: ${{ runner.temp }}/baselines
          INPUT_COMMENT: 'false'
          INPUT_ANNOTATIONS: 'false'

      - name: Missing artifact — must exit 2, not crash
        run: |
          set +e
          node dist/index.js > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 for a misconfigured run, got $rc"
            exit 1
          fi
        env:
          INPUT_ARCHIVE: ${{ runner.temp }}/nope.xcarchive
          INPUT_COMMENT: 'false'
